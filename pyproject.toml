[project]
name = "foresight"
version = "1.0.0"
requires-python = ">=3.11,<3.14"

dependencies = [
    # Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.5.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.2.0",
    "alembic>=1.15.0",
    # Task queue
    "celery>=5.4.0",
    "redis>=5.2.0",
    # HTTP
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    # AI / ML
    "openai>=1.50.0",
    "scikit-learn>=1.6.0",
    "numpy>=1.26.0",
    # NLP
    "spacy>=3.7.0",
    "langdetect>=1.0.9",
    # Ingestion
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "apscheduler>=3.10.0",
    "playwright>=1.40.0",
    # Telegram channel scraping (bypass Twitter rate-limit on FirstSquawk etc.)
    "telethon>=1.36.0",
    # Search
    "rank-bm25>=0.2.0",
    # Deduplication
    "simhash>=2.1.2",
    # Utils
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "websockets>=14.0.0",
    # Trading / Business
    "py_clob_client_v2>=0.1.0",
    "py-builder-signing-sdk>=0.0.2",
    "py-order-utils>=0.1.0",
    "web3>=6.0.0",
    "eth-account>=0.13.0",
    "python-telegram-bot>=21.0",
    "stripe>=8.0.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
    "pywebpush>=2.0.0",
    "google-auth>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.8",
    "httpx>=0.28.0",
    "mock>=5.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PT"]
# Ignore cosmetic rules that fire heavily on legacy code; keep real bug
# catchers (F401/F811/F821/F841, E9*, etc.). Re-enable case-by-case in a
# dedicated cleanup PR (T-028 backlog) — CI baseline must stay green.
ignore = [
    "E501",   # line too long — formatter responsibility
    "E402",   # module-level import not at top — used intentionally for sys.path tricks
    "E741",   # ambiguous variable name (l, I, O) — too restrictive
    "B008",   # function call in default arg — FastAPI Depends() pattern
    "B904",   # raise without from inside except — minor stylistic
    "B905",   # zip without strict — minor stylistic
    "N806",   # non-lowercase variable in function — SQL alias casing
    "N815",   # mixed-case variable in class — Pydantic JSON keys
    "N818",   # error suffix on exception — legacy naming
    "SIM102", # collapsible if — clarity > terseness
    "SIM103", # needless bool — clarity
    "SIM105", # suppressible exception — explicit try/except is fine
    "SIM108", # if-else block instead of if-exp — clarity
    "SIM113", # enumerate-for-loop — minor
    "SIM118", # in-dict-keys — minor
    "C400",   # unnecessary generator list — minor
    "C408",   # unnecessary collection call — minor
    "C416",   # unnecessary comprehension — minor
    "UP017",  # datetime.UTC alias — switch in cleanup PR
    "UP035",  # deprecated import — covered by typing migration
    "UP037",  # quoted annotation — minor
    "UP041",  # timeout-error alias — minor
    "UP045",  # use X | None — switch in cleanup PR (352 occurrences)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["unit: unit tests", "integration: integration tests"]

