[project]
name = "prediction-markets"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "alembic",
    "fastapi",
    "openai",
    "pgvector",
    "psycopg[binary,pool]",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
    "apscheduler",        
    "pydantic-settings",  
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
]

