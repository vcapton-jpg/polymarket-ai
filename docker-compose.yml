services:
  db:
    image: pgvector/pgvector:pg16
    container_name: presage-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: signal
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: presage-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: presage-app
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./app:/app/app
      - ./prompts:/app/prompts
      - ./alembic:/app/alembic

  # ── Worker: ingestion (RSS, World News, X-scraper inbox) ─────────
  worker-ingestion:
    build: .
    container_name: presage-worker-ingestion
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --pool=solo -Q ingestion -n ingestion@%h
    deploy:
      resources:
        limits:
          memory: 1536M
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./prompts:/app/prompts
      - ./data/x_scraper_inbox:/app/data/x_scraper_inbox
      - ./data/x_scraper_processed:/app/data/x_scraper_processed

  # ── Worker: pipeline (process_article + embed + backfill) ─────────
  worker-pipeline:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --pool=solo -Q pipeline -n pipeline@%h
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1536M
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./prompts:/app/prompts

  # ── Worker: scoring (fast-path events + hybrid search + LLM + signals) ──
  worker-scoring:
    build: .
    container_name: presage-worker-scoring
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --pool=solo -Q scoring -n scoring@%h
    deploy:
      resources:
        limits:
          memory: 2G
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./prompts:/app/prompts

  # ── Worker: markets (CLOB enrichment, isolated) ──────────────────
  worker-markets:
    build: .
    container_name: presage-worker-markets
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --pool=solo -Q markets -n markets@%h
    deploy:
      resources:
        limits:
          memory: 512M
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app

  # ── Worker: outcomes (price captures, resolutions) ────────────────
  worker-outcomes:
    build: .
    container_name: presage-worker-outcomes
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --pool=solo -Q default -n outcomes@%h
    deploy:
      resources:
        limits:
          memory: 512M
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app

  # ── Worker: trading + risk + reports (default queue) ──────────────
  worker-trading:
    build: .
    container_name: presage-worker-trading
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --pool=solo -Q trading -n trading@%h
    deploy:
      resources:
        limits:
          memory: 512M
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./prompts:/app/prompts

  beat:
    build: .
    container_name: presage-beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: presage-frontend
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
