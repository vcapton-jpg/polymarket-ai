services:
  db:
    # /dev/shm bumped from default 64M to 2G — required for pgvector HNSW
    # index builds on the markets table (200k × 1536-dim vectors). With
    # the default 64M, `CREATE INDEX ... USING hnsw` fails with
    # "could not resize shared memory segment ... No space left on device"
    # once the graph fanout exceeds shm. Discovered live during the
    # 2026-05-06 prod cutover — without this, markets has no vector index
    # and hybrid_search falls back to seq scan (seconds per query).
    shm_size: 2g
    image: pgvector/pgvector:pg16
    container_name: foresight-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: signal
    # Bound to 127.0.0.1 only — accessible from this host (psql / TablePlus
    # debug) but never from the network. Postgres uses a default password
    # in this stack, exposing 0.0.0.0:5435 was a wide-open relay.
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Postgres tuning for the host (Hetzner CPX32: 4 vCPU / 7.6 GB RAM,
    # SSD-backed). Stock defaults of shared_buffers=128MB / work_mem=4MB
    # gave a 82.4 % cache hit ratio on a 4.7 GB DB — anything that didn't
    # fit in 128 MB hit disk on every query. With 2 GB shared_buffers we
    # expect >99 % cache hit on warm queries.
    #
    # Settings rationale:
    # - shared_buffers=2GB: ~25 % of host RAM, covers the markets HNSW
    #   index hot pages and the active row set.
    # - effective_cache_size=4GB: planner hint; tells optimizer how much
    #   data is likely cached in OS+pg buffers combined.
    # - work_mem=32MB: per-sort/hash op. Hybrid_search top-30 ORDER BY
    #   spilled to disk at 4 MB. Per-connection × max_connections=200 →
    #   theoretical ceiling 6.4 GB, but real concurrency is ~5.
    # - maintenance_work_mem=512MB: VACUUM, CREATE INDEX. Today's HNSW
    #   build spilled to disk at 1 GB; 512 MB is fine for incremental ops.
    # - random_page_cost=1.1: SSD-aware (default 4 assumes spinning).
    # - effective_io_concurrency=200: SSD can sustain many parallel reads.
    # - shared_preload_libraries=pg_stat_statements: enables the
    #   slow-query telemetry the audit found missing. Then the extension
    #   itself is created via the alembic migration / runtime SQL.
    # - pg_stat_statements.track=all: include nested statements.
    # - idle_in_transaction_session_timeout=60000ms: kill stuck txns
    #   that block autovacuum.
    command: [
      "postgres",
      "-c", "max_connections=200",
      "-c", "shared_buffers=2GB",
      "-c", "effective_cache_size=4GB",
      "-c", "work_mem=32MB",
      "-c", "maintenance_work_mem=512MB",
      "-c", "random_page_cost=1.1",
      "-c", "effective_io_concurrency=200",
      "-c", "shared_preload_libraries=pg_stat_statements",
      "-c", "pg_stat_statements.track=all",
      "-c", "idle_in_transaction_session_timeout=60000"
    ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: foresight-redis
    # Bound to 127.0.0.1 only — accessible from this host (redis-cli debug)
    # but not from the network. Redis here runs without auth; exposing
    # 0.0.0.0:6379 to the world was a textbook RCE/data-exfil vector.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    # Cap memory at 1 GB with `volatile-lru` (updated 2026-05-10).
    #
    # Previous policy `noeviction` caused production zombification under
    # load: once 1 GB filled (mostly embcache:* OpenAI embedding cache,
    # ~94 % of DB 0 keyspace), any client write returned OutOfMemoryError.
    # Celery workers don't catch this exception cleanly — they heartbeat
    # but stop consuming tasks (observed 2026-05-10: worker-pipeline
    # zombie 30+ min, signal emission to 0 until manual restart).
    #
    # `volatile-lru` evicts the least-recently-used keys that have a TTL
    # set. In our DB 0, 12 640 / 12 655 keys have TTL — and all of them
    # are embcache:* (set by app/processing/embedding_cache.py with a TTL
    # in the days-range). The 15 keys without TTL are Celery broker
    # data (queue lists like "pipeline", "scoring", etc.) — these stay
    # protected. So evictions hit only the regeneratable cache, never
    # in-flight tasks.
    #
    # Cost of an eviction: one OpenAI re-embedding (~$0.00002 per news).
    # Cost of a worker zombification: 0 signals until manual `restart`.
    # The tradeoff is clearly in favor of LRU eviction.
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rsshub:
    # MUST use the chromium-bundled variant (not :latest). Twitter (X) is
    # fully JS-rendered as of 2026 — the public timeline endpoints return
    # an empty HTML shell that gets populated by client-side GraphQL XHR.
    # The default :latest image has no browser, so the scraper hits the
    # shell and falls back to "0 items" with `error: undefined` in logs.
    # The :chromium-bundled variant ships a Chrome headless runtime that
    # executes the JS payload and extracts real tweets. Verified live
    # 2026-05-06: every X account fetches 15-20 tweets per cycle.
    # Image is ~1.6 GB (vs 625 MB for :latest); memory at runtime ~350 MB.
    image: diygod/rsshub:chromium-bundled
    container_name: foresight-rsshub
    restart: unless-stopped
    environment:
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/5
      # Default `CACHE_EXPIRE` is 300s (5 min). Combined with our 90 s
      # poll interval, that adds up to ~6 min of avoidable lag on cache
      # misses. 60 s aligns the cache TTL with the poll, keeping the
      # cache hot for repeated callers but releasing fresh feeds within
      # a poll cycle. Trade-off: ~6× more upstream Twitter scrapes per
      # source per hour. RSSHub's burner-cookie path can sustain it.
      CACHE_EXPIRE: "60"
      NODE_ENV: production
      # Twitter scraping requires session cookies from a logged-in (burner) X account.
      # Values live in .env (gitignored). See docs runbook: setup-rsshub-twitter.md.
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN}
      TWITTER_CT0: ${TWITTER_CT0}
    depends_on:
      redis:
        condition: service_healthy
    # No host port mapping — RSSHub is consumed only by `worker-ingestion`
    # over the Docker bridge network at `http://rsshub:1200`. Exposing it
    # to the host serves no use case and gives a free OSINT scraping
    # service to anyone on the LAN.

  app:
    build: .
    container_name: foresight-app
    # Run Alembic migrations before starting uvicorn — the API lifespan no
    # longer auto-creates tables (Alembic owns the schema). Audit follow-up.
    # `--reload-dir app` scopes the file watcher to the application code.
    # Without it, `--reload` watches the entire workdir including `.venv/`,
    # and any `uv sync` / `pip install` triggers a watchfiles avalanche
    # that wedges uvicorn in a 400-Bad-Request loop until the container
    # is restarted. (Symptom: API returns "Invalid HTTP request received"
    # to every request despite uvicorn appearing healthy.)
    command: sh -c "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./app:/app/app
      - ./prompts:/app/prompts
      - ./alembic:/app/alembic
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./pyproject.toml:/app/pyproject.toml

  # ── Worker: ingestion (RSS, World News, X-scraper inbox) ─────────
  # `replicas: 2` (down from 4 on 2026-05-09) — incident 2026-05-09
  # showed the host (Hetzner CPX31, 7.6 GB physical) running with 95 %
  # swap utilization and host-level OOM-killing postgres + celery.
  # Total docker `deploy.resources.limits.memory` claim across services
  # was ~28 GB on 7.6 GB host (3.7× oversubscription), and each
  # ingestion replica's 1.3 GB spaCy/Python baseline made these the
  # heaviest workers. 2 replicas (instead of 4) cuts ~2.6 GB of working
  # set. Throughput trade-off: drain ~60 fetch_rss/min vs beat's
  # ~200/min — queue will grow somewhat but Filter A pre-SQL means most
  # `compute_score_and_signal` work was already gated, and the scoring
  # bottleneck is LLM I/O not ingestion. Long-term fix is host upgrade
  # to CPX41 (16 GB) so we can restore 4 replicas.
  worker-ingestion:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --pool=solo -Q ingestion -n ingestion@%h
    # Memory: 3 GB (was 1.5 GB). Live RSS at 99.6 % of the previous
    # 1.5 GB ceiling triggered intermittent OOM-SIGKILLs on Docker
    # Desktop macOS even with NullPool. The Python+spaCy en_core_web_lg
    # baseline alone is ~1.3 GB RSS at boot; 1.5 GB left no headroom
    # for normal task allocations. 3 GB gives a 1.7 GB working margin.
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 3G
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./prompts:/app/prompts
      - ./data/x_scraper_inbox:/app/data/x_scraper_inbox
      - ./data/x_scraper_processed:/app/data/x_scraper_processed

  # ── Worker: pipeline (process_article + embed + backfill) ─────────
  worker-pipeline:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --pool=solo -Q pipeline -n pipeline@%h
    # Memory: 3 GB (was 1.5 GB). Same rationale as worker-ingestion —
    # spaCy en_core_web_lg + SQLAlchemy + asyncpg + Python embedded
    # baseline at ~1.3-1.4 GB RSS at boot. The previous 1.5 GB ceiling
    # left ~100 MB headroom; any per-task allocation pushed it over and
    # the host kernel SIGKILLed the container (exit 137). Diagnosed
    # 2026-05-05 from `docker events` showing `oom`.
    # `replicas: 1` (down from 2 on 2026-05-09) — see worker-ingestion
    # comment for the host-OOM context. Pipeline tasks (process_article
    # + embed) are throughput-bound by OpenAI API not by parallelism;
    # 1 replica drains the queue ~30 % slower but fits the memory budget.
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 3G
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./prompts:/app/prompts

  # ── Worker: scoring (fast-path events + hybrid search + LLM + signals) ──
  # Realtime hot path only — see worker-scoring-batch for the heavy/batch
  # twin that drains the four subordinate queues (P1-9 split).
  #
  # Scaled to 3 replicas (was 1) on 2026-05-06; reduced to 2 on
  # 2026-05-09 after host-OOM incident — see worker-ingestion comment
  # for context. Each scoring worker is ~1 GB RSS at peak so 3 replicas
  # cost ~3 GB of host RAM the CPX31 doesn't have. 2 replicas still
  # double the original solo throughput and absorb ~24 events/min,
  # well above current emission peak of ~70/day = 0.05/min.
  # `container_name` removed because compose forbids it with replicas.
  worker-scoring:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --pool=solo -Q scoring -n scoring@%h
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./prompts:/app/prompts

  # ── Worker: scoring-batch (sourcing / embeddings / ranking_shadow / recovery) ──
  # Drains the four queues that used to share `scoring` and would HOL-block
  # the realtime path. HOL inside this worker is acceptable: every task here
  # is non-latency-sensitive (shadow re-runs, batch backfills, recovery
  # sweeps). Adding more parallelism would mostly buy contention on the LLM
  # quota and shared sessions; bump only after observing real backlog.
  worker-scoring-batch:
    build: .
    container_name: foresight-worker-scoring-batch
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --pool=solo -Q sourcing,embeddings,ranking_shadow,scoring_recovery -n scoring-batch@%h
    deploy:
      resources:
        limits:
          memory: 2G
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./prompts:/app/prompts

  # ── Worker: markets (CLOB enrichment, isolated) ──────────────────
  # Memory: 1 GB. Reverted from a 2 GB bump on 2026-05-09 — that change
  # was made under a wrong host-RAM assumption (thought CPX41 / 16 GB,
  # actually CPX31 / 7.6 GB). The extra GB pushed total `deploy` claim
  # over the host budget and triggered host-level OOM kills overnight
  # (postgres + celery, dmesg logs at incident timestamps 91754 / 92304
  # / 92731). The 1 GB cgroup OOMs we saw on 2026-05-08 were a SYMPTOM
  # of host pressure, not a cgroup-sizing bug — bumping the cgroup just
  # moved the OOM up to the host. Real fix is reducing replicas + (TODO)
  # upgrading the host. Audit 2026-05-05 originally bumped 512 MB → 1 GB
  # because RSS was at 90.7 % of 512 MB during fetch_markets +
  # compute_market_percentiles; that 1 GB is the right number.
  worker-markets:
    build: .
    container_name: foresight-worker-markets
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --pool=solo -Q markets -n markets@%h
    deploy:
      resources:
        limits:
          memory: 1G
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app

  # ── Worker: outcomes (price captures, resolutions) ────────────────
  worker-outcomes:
    build: .
    container_name: foresight-worker-outcomes
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --pool=solo -Q default -n outcomes@%h
    deploy:
      resources:
        limits:
          memory: 512M
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app

  # ── Worker: trading + risk + reports (default queue) ──────────────
  worker-trading:
    build: .
    container_name: foresight-worker-trading
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --pool=solo -Q trading -n trading@%h
    deploy:
      resources:
        limits:
          memory: 512M
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./prompts:/app/prompts

  beat:
    build: .
    container_name: foresight-beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/signal
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/signal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foresight-frontend
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
