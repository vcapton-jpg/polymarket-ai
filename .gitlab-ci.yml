image : ghcr.io/astral-sh/uv:python3.11-bookworm-slim

stages:
  - lint
  - test
  - build
  - deploy

default:
  before_script:
    - uv sync --extra dev --locked

lint:
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  script:
    - uv run pytest

check :
  stage : build
  script : 
    - uv run python -c "import app.api.main"

docker-build :
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  before_script: [] 
  script:
    - docker build -t prediction-markets:latest .